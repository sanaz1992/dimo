---
deployment:
  tasks:
    - export DEPLOYPATH=/home/h422794/dimo
    - cd $DEPLOYPATH && composer install --no-dev --optimize-autoloader
    - cd $DEPLOYPATH && php artisan migrate --force
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan optimize
    - cd $DEPLOYPATH && php artisan queue:restart
    - cd $DEPLOYPATH && php artisan db:seed --force
